<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yoshlar Arena</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#18202a}
.app{max-width:520px;margin:auto;min-height:100vh;background:white}
header{background:#1677ff;color:white;padding:22px 18px;text-align:center}
header h1{margin:0;font-size:25px}
header p{margin:7px 0 0;font-size:14px}
.controls{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid #eee}
.controls button{border:0;background:#eef3f8;border-radius:10px;padding:10px 15px;font-size:20px}
.date{text-align:center;font-weight:bold}
.slots{padding:12px}
.slot{border:1px solid #e1e6eb;border-radius:12px;padding:14px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between}
.time{font-size:17px;font-weight:bold}
.status{font-size:14px;font-weight:bold}
.free{background:#f0fff4;border-color:#b9e7c5}
.free .status{color:#16843a}
.busy{background:#fff3f3;border-color:#f1c2c2}
.busy .status{color:#d32f2f}
.fixed{background:#f2f5ff;border-color:#c8d4ff}
.fixed .status{color:#315bd6}
.legend{padding:5px 16px 18px;font-size:13px;color:#555}
.modal-bg{display:none;position:fixed;inset:0;background:#0008;align-items:end;justify-content:center}
.modal{width:min(520px,100%);background:white;border-radius:18px 18px 0 0;padding:20px}
.modal h2{margin-top:0}
input{width:100%;padding:13px;margin:7px 0 12px;border:1px solid #ccd3da;border-radius:9px;font-size:16px}
.primary{width:100%;padding:14px;border:0;border-radius:10px;background:#1677ff;color:white;font-size:16px;font-weight:bold}
.cancel{width:100%;padding:12px;border:0;background:white;font-size:15px}
</style>
</head>
<body>
<div class="app">
<header>
<h1>⚽ YOSHLAR ARENA</h1>
<p>Bobolochin mahallasi</p>
</header>

<div class="controls">
<button onclick="changeDate(-1)">‹</button>
<div class="date" id="date"></div>
<button onclick="changeDate(1)">›</button>
</div>

<div class="slots" id="slots"></div>

<div class="legend">
🟢 Bo‘sh &nbsp;&nbsp; 🔴 Band &nbsp;&nbsp; 🔵 Doimiy
</div>
</div>

<div class="modal-bg" id="modalBg">
<div class="modal">
<h2 id="modalTitle">Vaqtni band qilish</h2>
<label>Ismingiz</label>
<input id="name" placeholder="Masalan: Aziz">
<label>Telefon</label>
<input id="phone" placeholder="90 123 45 67" inputmode="tel">
<button class="primary" onclick="book()">BAND QILISH</button>
<button class="cancel" onclick="closeModal()">Bekor qilish</button>
</div>
</div>

<script>
let selectedDate = new Date();
let selectedHour = null;
let bookings = JSON.parse(localStorage.getItem("yoshlarArenaBookings") || "{}");

function key(){
  return selectedDate.toISOString().slice(0,10);
}

function dateText(){
  return selectedDate.toLocaleDateString("uz-UZ",{day:"2-digit",month:"long",year:"numeric"});
}

function render(){
  document.getElementById("date").textContent = dateText();
  const day = key();
  const dayBookings = bookings[day] || {};
  const slots = document.getElementById("slots");
  slots.innerHTML = "";

  for(let h=0;h<24;h++){
    const b = dayBookings[h];
    const div = document.createElement("div");
    div.className = "slot " + (b ? (b.fixed ? "fixed":"busy") : "free");
    const next = String((h+1)%24).padStart(2,"0");
    const hh = String(h).padStart(2,"0");
    let right = b ? (b.fixed ? "🔵 DOIMIY<br>"+b.name : "🔴 BAND<br>"+b.name) : "🟢 BO‘SH";
    div.innerHTML = `<div class="time">${hh}:00 – ${next}:00</div><div class="status">${right}</div>`;
    if(!b) div.onclick=()=>openModal(h);
    slots.appendChild(div);
  }
}

function changeDate(n){
  selectedDate.setDate(selectedDate.getDate()+n);
  render();
}

function openModal(h){
  selectedHour=h;
  const next=String((h+1)%24).padStart(2,"0");
  document.getElementById("modalTitle").textContent =
    `${String(h).padStart(2,"0")}:00 – ${next}:00`;
  document.getElementById("name").value="";
  document.getElementById("phone").value="";
  document.getElementById("modalBg").style.display="flex";
}

function closeModal(){
  document.getElementById("modalBg").style.display="none";
}

function book(){
  const name=document.getElementById("name").value.trim();
  const phone=document.getElementById("phone").value.trim();
  if(!name){alert("Ismingizni kiriting.");return;}
  const day=key();
  if(!bookings[day]) bookings[day]={};
  if(bookings[day][selectedHour]){
    alert("Bu vaqt allaqachon band qilingan.");
    closeModal(); render(); return;
  }
  bookings[day][selectedHour]={name,phone,fixed:false};
  localStorage.setItem("yoshlarArenaBookings",JSON.stringify(bookings));
  closeModal(); render();
}
render();
</script>
</body>
</html>
